# Every value can be overridden with an environment variable (12-factor style).
# Format: ${ENV_VAR:default}. Defaults suit the local Vagrant lab only.
# Never commit real credentials: inject them via env vars, Jenkins credentials,
# or AWS SSM Parameter Store / Secrets Manager.

# --- Database ---
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://${DB_HOST:db01}:${DB_PORT:3306}/${DB_NAME:accounts}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
jdbc.username=${DB_USER:admin}
jdbc.password=${DB_PASSWORD:change-me}

# --- Memcached (active + standby) ---
memcached.active.host=${MEMCACHED_HOST:mc01}
memcached.active.port=${MEMCACHED_PORT:11211}
memcached.standBy.host=${MEMCACHED_STANDBY_HOST:127.0.0.2}
memcached.standBy.port=${MEMCACHED_STANDBY_PORT:11211}

# --- RabbitMQ ---
rabbitmq.address=${RABBITMQ_HOST:rmq01}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USER:test}
rabbitmq.password=${RABBITMQ_PASSWORD:change-me}

# --- Elasticsearch ---
elasticsearch.host=${ES_HOST:localhost}
elasticsearch.port=${ES_PORT:9300}
elasticsearch.cluster=vprofile
elasticsearch.node=vprofilenode

# --- Web / uploads ---
spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB

# --- Security ---
spring.security.user.name=${APP_ADMIN_USER:admin_vp}
spring.security.user.password=${APP_ADMIN_PASSWORD:change-me}
spring.security.user.roles=ADMIN
logging.level.org.springframework.security=WARN

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- Hibernate / logging ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.com.visualpathit.account.service.SecurityServiceImpl=OFF
